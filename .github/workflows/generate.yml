name: Extract Standalone Individual Items

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: LPC Katman Deposunu İndir
        run: |
          if [ ! -d "lpc_assets" ]; then
            git clone --depth 1 https://github.com/sanderfrenken/Universal-LPC-Spritesheet-Character-Generator.git temp_lpc
            mv temp_lpc/spritesheets lpc_assets
            rm -rf temp_lpc
          fi

      - name: Tekil Kıyafet Parçalarını Üret ve Ayıkla
        run: python build_catalog.py

      - name: Üretilen PNG Görsellerini Repoya Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: tekil kiyafet parcalari ayiklandi [skip ci]"
          file_pattern: 'dist_items/**/*.png'
          
