name: Extract Standalone Individual Items

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sadece Yerel Süzme İşlemini Çalıştır
        run: python build_catalog.py

      - name: Süzülen Görselleri Repoya Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: normal erkek kiyafetleri suzuldu [skip ci]"
          file_pattern: 'dist_items/**/*.png'
          
